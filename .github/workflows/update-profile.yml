name: Update Profile Stats

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh profile SVGs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          python3 scripts/generate_profile.py --refresh

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json assets/profile-light.svg assets/profile-dark.svg
          git diff --staged --quiet || (git commit -m "chore: update profile stats [skip ci]" && git push)
